# Server settings. Line format: key value

# Players cannot pass through each other (1) or can (0).
player.collisions.enabled 1

# Number of bots added at startup (players can spectate and take them over).
bots.count 2

# Number of animated robots (skinned model; the server chooses its animation and it is replicated to the client).
robots.count 1

# The real character model (assets/models/dancer/): it breakdances when you come close.
dancers.count 1
