# Server settings. Line format: key value

# Players cannot pass through each other (1) or can (0).
player.collisions.enabled 1

# Number of bots added at startup (players can spectate and take them over).
bots.count 10

# Number of animated robots (skinned model; the server chooses its animation and it is replicated to the client).
robots.count 10

# The real character model (assets/models/dancer/): it breakdances when you come close.
dancers.count 20

# Movement (metres, seconds). Sent to every client in WELCOME, so prediction uses the same values.
# Walk / run (sprint) speed, crouch multiplier, jump speed, gravity.
move.walk.speed 4.0
move.run.speed 6.5
move.crouch.scale 0.5
move.jump.speed 6.0
move.gravity 20.0
# Hard ceiling on horizontal speed (bunnyhop and air strafing can gain speed up to this).
move.max_speed 12.0
# Source-style ground movement: acceleration, friction, and the friction floor (stop speed).
move.ground.accelerate 10.0
move.ground.friction 4.0
move.ground.stop_speed 1.9
# Source-style air strafing: acceleration and the per-tick cap that makes strafe-jumping work.
move.air.accelerate 10.0
move.air.wish_cap 0.76
# 1: landing and jumping again keeps the speed. 0: jumps are capped at run speed.
move.bunnyhop.enabled 1
# Slide: crouch while moving fast on the ground. Starts above min_speed, lasts duration seconds,
# friction is multiplied by slide.friction while sliding.
move.slide.enabled 1
move.slide.min_speed 5.0
move.slide.duration 1.2
move.slide.friction 0.5
