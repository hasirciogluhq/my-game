syntax = "proto3";

package netproto;

// The client sends one per tick. The server queues it when the packet arrives and
// processes it in the next server tick. No rewind / lag compensation.
// tick: the client's command sequence number (starts at 1). The server reports the last number it processed
// via Player.last_cmd_seq; client prediction reconciles with it.
message UserCmd {
    uint32 tick = 1;

    // Normalized movement values, in the range -1..1.
    float forward_move = 2;   // W = +1, S = -1
    float side_move = 3;      // D = +1, A = -1
    float up_move = 4;        // not used for now; for flying/swimming later

    // View direction (radians).
    float yaw = 5;
    float pitch = 6;

    // Buttons (EButton bitmask).
    uint32 buttons = 7;            // held down
    uint32 buttons_pressed = 8;    // started being pressed this tick (edge)
    uint32 buttons_released = 9;   // released this tick (edge)
}

message Vec3 {
    float x = 1;
    float y = 2;
    float z = 3;
}

// Component messages: one-to-one with engine/ecs/components.hpp.
message Transform {
    Vec3 position = 1;
    float yaw = 2;
    float pitch = 3;
}

message Velocity {
    Vec3 linear = 1;
}

message Player {
    uint32 player_id = 1;
    uint32 health = 2;
    bool on_ground = 3;
    uint32 last_cmd_seq = 4;   // last UserCmd.tick the server processed (prediction ack)
    float slide_time = 5;      // seconds of slide left (0 = not sliding)
}

// Movement tuning (cvars move.*). Sent in WELCOME so client prediction uses the same values.
message MovementSettings {
    float walk_speed = 1;
    float run_speed = 2;
    float crouch_scale = 3;
    float jump_speed = 4;
    float gravity = 5;
    float max_speed = 6;
    float ground_accelerate = 7;
    float ground_friction = 8;
    float ground_stop_speed = 9;
    float air_accelerate = 10;
    float air_wish_cap = 11;
    bool bunnyhop = 12;
    bool slide = 13;
    float slide_min_speed = 14;
    float slide_duration = 15;
    float slide_friction = 16;
}

// The projectile position is not computed, it is stored: pos(t) = origin + velocity * (t - spawn_tick) * dt
message Projectile {
    uint32 owner_id = 1;
    uint32 spawn_tick = 2;
    Vec3 origin = 3;
    Vec3 velocity = 4;
}

// Animation state chosen by the server (EAnimState). No pose is sent: the client computes it from (tick - start_tick).
message Animator {
    uint32 model = 1;             // EModel
    uint32 state = 2;             // EAnimState
    uint32 start_tick = 3;        // server tick at which the state started
    uint32 prev_state = 4;        // previous state, blended during the transition
    uint32 prev_start_tick = 5;
}

// An entity: net_id + the components it owns (absent ones are empty).
message Entity {
    uint32 net_id = 1;
    Transform transform = 2;
    Velocity velocity = 3;
    Player player = 4;
    Projectile projectile = 5;
    Animator animator = 6;
}

message WorldSnapshot {
    uint32 tick = 1;
    uint32 tick_rate = 2;
    repeated Entity entities = 3;
}

// Client -> server: spectate / take over a bot / release (EControlAction).
message ControlRequest {
    uint32 action = 1;
    uint32 target_net_id = 2;   // pawn to spectate
}

message Envelope {
    enum Type {
        TYPE_UNSPECIFIED = 0;
        TYPE_HELLO = 1;
        TYPE_WELCOME = 2;
        TYPE_USER_CMD = 3;
        TYPE_SNAPSHOT = 4;
        TYPE_CONTROL = 5;       // client -> server: ControlRequest
        TYPE_VIEW_TARGET = 6;   // server -> client: the watched pawn changed
    }

    Type type = 1;
    uint32 player_id = 2;
    uint32 tick_rate = 3;      // server tick rate in WELCOME
    UserCmd cmd = 4;
    WorldSnapshot snapshot = 5;
    ControlRequest control = 6;
    uint32 view_target_net_id = 7;   // in VIEW_TARGET: net_id of the watched pawn, 0 = not watching
    MovementSettings movement = 8;   // in WELCOME
}
